<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base rounded -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Outer orbital ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGradient)" stroke-width="8" opacity="0.3" />
  
  <!-- Cybernetic tech lines / dashboard tick marks on ring -->
  <g stroke="url(#neonGradient)" stroke-width="4" opacity="0.6">
    <line x1="256" y1="56" x2="256" y2="72" />
    <line x1="256" y1="440" x2="256" y2="456" />
    <line x1="56" y1="256" x2="72" y2="256" />
    <line x1="440" y1="256" x2="456" y2="256" />
  </g>

  <!-- Ambient Eye Glow Background -->
  <circle cx="256" cy="256" r="130" fill="url(#eyeGlow)" opacity="0.5" />

  <!-- Inner active core eye ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#neonGradient)" stroke-width="12" filter="url(#glow)" />

  <!-- pupil dot -->
  <circle cx="256" cy="256" r="35" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="15" fill="#22d3ee" />
</svg>
