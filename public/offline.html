<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airo Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .modal {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(to top right, #dc2626, #fb7185);
            border: 4px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
            position: relative;
            z-index: 10;
        }

        .icon-circle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            filter: blur(15px);
            z-index: -1;
            mix-blend-mode: overlay;
        }

        .icon-circle svg {
            width: 48px;
            height: 48px;
            color: #fff;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 12px 0;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: -0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin: 0 0 32px 0;
            font-size: 15px;
            line-height: 1.5;
        }

        .input-group {
            width: 100%;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            font-weight: 600;
            margin-left: 4px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        button {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: scale(0.97);
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="modal">
        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" x2="22" y1="2" y2="22"/>
                <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
                <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
                <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
                <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
                <path d="M5 13a10 10 0 0 1 5.24-2.76"/>
                <line x1="12" x2="12.01" y1="20" y2="20"/>
            </svg>
        </div>
        <h1>Network Disconnected</h1>
        <p>AiroKiosk is offline. Enter a Wi-Fi network and password to automatically connect.</p>

        <div class="input-group">
            <label>Network Name (SSID)</label>
            <input type="text" id="ssid" placeholder="Enter SSID" />
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button id="connectBtn">Connect to Wi-Fi</button>
    </div>

    <script>
        document.getElementById('connectBtn').addEventListener('click', async () => {
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('connectBtn');

            if (!ssid) {
                alert("Please enter a network name.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Connecting...";

            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AiroKiosk) {
                    await window.Capacitor.Plugins.AiroKiosk.connectWifi({ ssid, password });
                    
                    btn.textContent = "Connected! Reloading...";
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else {
                    alert("AiroKiosk plugin not found. Ensure app is built natively.");
                    btn.disabled = false;
                    btn.textContent = "Connect to Wi-Fi";
                }
            } catch (err) {
                alert("Failed to connect: " + (err.message || err));
                btn.disabled = false;
                btn.textContent = "Connect to Wi-Fi";
            }
        });
        
        // Listen for online event and reload automatically
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
